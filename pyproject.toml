[project]
name = "desktop-buddy"
version = "0.1.0"
description = "A drop-in sprite desktop pal built on PySide6"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.8",
]

[project.optional-dependencies]
studio = [
    "gradio>=6.22",
    "pillow>=10",
]

[project.scripts]
desktop-buddy = "desktop_buddy.main:main"
desktop-buddy-studio = "desktop_buddy.studio.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/desktop_buddy"]
